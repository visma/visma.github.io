<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platine Paris</title>
<style>
  :root { --bg: #fbf6ee; --fg: #2b1d1d; --muted: #6d5f5f; --accent: #7b1e2b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1516; --fg: #f3ece6; --muted: #b8aaa6; --accent: #e07a86; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  p { color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Platine Paris</h1>
  <p>Marche dans Paris, la carte se colorie rue après rue.</p>
  <p><a href="https://github.com/visma/applications/releases/latest">Télécharger l'app Android</a></p>
</main>
</body>
</html>
