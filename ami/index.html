<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platine Paris · Invitation</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #fbf6ee; --fg: #2b1d1d; --muted: #6d5f5f; --accent: #7b1e2b; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1516; --fg: #f3ece6; --muted: #b8aaa6; --accent: #e07a86; --card: #2a2022; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  .code { display: inline-block; background: var(--card); border-radius: 12px; padding: 12px 20px; font: 700 1.4rem ui-monospace, monospace; letter-spacing: .05em; margin-bottom: 28px; }
  a.btn { display: block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; border-radius: 999px; padding: 14px 20px; margin: 0 0 12px; }
  a.btn.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Un ami te défie sur Platine Paris</h1>
  <p id="intro">Marche dans Paris et colorie les rues avant lui : la guerre de territoire entre amis.</p>
  <div class="code" id="code">—</div>
  <a class="btn" id="open" href="#">Ouvrir dans Platine</a>
  <a class="btn secondary" id="install" href="https://github.com/visma/applications/releases/latest/download/PlatineParis.apk">Installer l'app (Android)</a>
  <small id="note">Déjà installée ? « Ouvrir dans Platine » envoie la demande d'ami toute seule.</small>
</main>
<script>
  // Code de l'ami (?code=PLAT-XXXX-XXXX) ; lien ouvert dans l'app quand elle est installée (lien vérifié), sinon ici
  const code = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20);
  document.getElementById('code').textContent = code || '—';
  document.getElementById('open').href =
    'intent://visma.github.io/ami/?code=' + encodeURIComponent(code) +
    '#Intent;scheme=https;package=io.github.visma.citywalker;S.browser_fallback_url=' +
    encodeURIComponent('https://github.com/visma/applications/releases/latest') + ';end';
  if (!navigator.language.toLowerCase().startsWith('fr')) {
    document.documentElement.lang = 'en';
    document.title = 'Platine Paris · Invitation';
    document.getElementById('title').textContent = 'A friend challenges you on Platine Paris';
    document.getElementById('intro').textContent = 'Walk Paris and colour the streets before they do: a territory war between friends.';
    document.getElementById('open').textContent = 'Open in Platine';
    document.getElementById('install').textContent = 'Install the app (Android)';
    document.getElementById('note').textContent = 'Already installed? "Open in Platine" sends the friend request automatically.';
  }
</script>
</body>
</html>
